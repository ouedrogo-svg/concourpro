<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription Candidat</title>
    <link rel="stylesheet" href="{% static 'cours/styles.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <span class="brand"><span class="emoji">🎓</span>ConCourPro - Candidats</span>
            <div class="top-actions">
                <a href="{% url 'connexion_candidat' %}" class="link-muted">Connexion</a>
                <button id="theme-toggle" class="btn-secondary" type="button">Mode sombre</button>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="card">
            <h1>Inscription candidat</h1>
            <p>Renseignez votre nom, prenom et mot de passe pour creer votre compte.</p>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">S'inscrire</button>
            </form>
            <p class="back-link">
                Deja inscrit ? <a href="{% url 'connexion_candidat' %}">Se connecter</a>
            </p>
        </section>
    </main>
    <script>
        const toggleButton = document.getElementById("theme-toggle");
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            toggleButton.textContent = "Mode clair";
        }
        toggleButton.addEventListener("click", () => {
            const isDark = document.documentElement.getAttribute("data-theme") === "dark";
            if (isDark) {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
                toggleButton.textContent = "Mode sombre";
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
                toggleButton.textContent = "Mode clair";
            }
        });
    </script>
</body>
</html>

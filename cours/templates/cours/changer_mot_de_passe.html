<!DOCTYPE html>
<html lang="fr">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Changer mot de passe</title>
    <link rel="stylesheet" href="{% static 'cours/styles.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="topbar-inner">
            <span class="brand"><span class="emoji">🎓</span>Securite du compte</span>
            <div class="top-actions">
                <a href="{% url 'profil_candidat' %}" class="link-muted">Mon profil</a>
                <a href="{% url 'deconnexion_candidat' %}" class="link-muted">Se deconnecter</a>
                <button id="theme-toggle" class="btn-secondary" type="button">Mode sombre</button>
            </div>
        </div>
    </header>
    <main class="container">
        <section class="card">
            <h1>Changer votre mot de passe</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit">Mettre a jour</button>
            </form>
        </section>
    </main>
    <script>
        const toggleButton = document.getElementById("theme-toggle");
        const savedTheme = localStorage.getItem("theme");
        if (savedTheme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
            toggleButton.textContent = "Mode clair";
        }
        toggleButton.addEventListener("click", () => {
            const isDark = document.documentElement.getAttribute("data-theme") === "dark";
            if (isDark) {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("theme", "light");
                toggleButton.textContent = "Mode sombre";
            } else {
                document.documentElement.setAttribute("data-theme", "dark");
                localStorage.setItem("theme", "dark");
                toggleButton.textContent = "Mode clair";
            }
        });
    </script>
</body>
</html>
